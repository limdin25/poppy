<!--
  Sign-in code for go.heyelsie.com/continue.

  This is the template Supabase uses for signInWithOtp() against an EXISTING
  user — which is exactly what /continue calls. It must render {{ .Token }},
  the 6-digit code, because the page shows a code box.

  {{ .ConfirmationURL }} is DELIBERATELY absent. Tapping a magic link consumes
  the OTP and redirects to the project's Site URL — which is not
  go.heyelsie.com — and Supabase sessions are per-origin, so the customer would
  land signed-in on the wrong app with no reviews dashboard. Code-only avoids
  the redirect allow-list entirely.

  ⚠️ The HOSTED project reads the copy pasted into
  Supabase → Authentication → Email Templates → Magic Link.
  This file is the source of truth; the two must be kept in sync.
-->
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.6;color:#1c1c28;max-width:420px;margin:0 auto;">
  <p style="margin:0 0 6px;">Your HeyElsie sign-in code:</p>
  <p style="font-size:34px;font-weight:700;letter-spacing:8px;margin:12px 0;">{{ .Token }}</p>
  <p style="color:#6b7280;font-size:13px;margin:0;">
    Expires in 60 minutes. If you didn't ask for this, you can safely ignore this email.
  </p>
</div>
