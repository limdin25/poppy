<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rightmove Property Scraper</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, sans-serif; }
  .col { height: calc(100vh - 56px); overflow-y: auto; }
  textarea { font-family: ui-monospace, monospace; font-size: 12px; }
  .log-line { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 11px; }
</style>
</head>
<body class="bg-slate-50 text-slate-800">
<header class="h-14 bg-slate-900 text-white flex items-center px-4 justify-between">
  <div class="flex items-center gap-6">
    <a href="/" class="px-3 py-1 rounded text-sm bg-slate-700 hover:bg-slate-600 transition">Google Maps</a>
    <a href="/facebook" class="px-3 py-1 rounded text-sm bg-slate-700 hover:bg-slate-600 transition">Facebook Ads</a>
    <a href="/rightmove" class="px-3 py-1 rounded text-sm bg-emerald-600 font-semibold">Rightmove</a>
    <a href="/floorplans" class="px-3 py-1 rounded text-sm bg-slate-700 hover:bg-slate-600 transition">Floor Plans</a>
    <a href="/shortlist" class="px-3 py-1 rounded text-sm bg-slate-700 hover:bg-slate-600 transition">Shortlist</a>
    <a href="/comps" class="px-3 py-1 rounded text-sm bg-slate-700 hover:bg-slate-600 transition">Price Comparison</a>
  </div>
  <div id="status-banner" class="text-sm px-3 py-1 rounded bg-slate-700">Ready</div>
</header>

<div class="grid grid-cols-12 gap-3 p-3">
  <!-- LEFT: CONFIG -->
  <section class="col col-span-3 bg-white rounded shadow p-3 space-y-3">
    <h2 class="font-semibold text-slate-700">Rightmove Search</h2>

    <label class="block text-xs font-medium">Search URLs (one per line)</label>
    <textarea id="search-urls" rows="8" class="w-full border rounded p-2"
      placeholder="Paste Rightmove search URLs here...&#10;https://www.rightmove.co.uk/property-for-sale/find.html?searchLocation=..."></textarea>

    <div id="preview" class="text-xs text-slate-600">0 search URLs to scrape</div>

    <fieldset class="border rounded p-2">
      <legend class="text-xs font-medium px-1">Proxy (optional)</legend>
      <div class="grid grid-cols-2 gap-1">
        <input id="px-host" class="border rounded p-1 text-sm" placeholder="host">
        <input id="px-port" class="border rounded p-1 text-sm" placeholder="port">
        <input id="px-user" class="border rounded p-1 text-sm col-span-2" placeholder="username">
        <input id="px-pass" type="password" class="border rounded p-1 text-sm col-span-2" placeholder="password">
        <label class="text-xs col-span-2">Rotate every
          <input id="px-rotate" type="number" value="25" class="w-16 border rounded p-1 text-sm"> requests
        </label>
        <label class="text-xs col-span-2"><input id="px-sticky" type="checkbox"> sticky session</label>
      </div>
    </fieldset>

    <fieldset class="border rounded p-2">
      <legend class="text-xs font-medium px-1">Settings</legend>
      <label class="text-xs block">Max pages per search URL
        <input id="max-pages" type="number" value="50" class="w-20 border rounded p-1">
      </label>
      <label class="text-xs block">Delay min/max (s)
        <input id="d-min" type="number" step="0.5" value="3" class="w-16 border rounded p-1">
        <input id="d-max" type="number" step="0.5" value="6" class="w-16 border rounded p-1">
      </label>
      <label class="text-xs block"><input id="headless" type="checkbox" checked> headless browser</label>
      <label class="text-xs block"><input id="force" type="checkbox"> force re-scrape already-done URLs</label>
    </fieldset>

    <div class="flex gap-2">
      <button id="btn-start" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded py-2 font-semibold">Start</button>
      <button id="btn-pause" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white rounded py-2 font-semibold">Pause</button>
      <button id="btn-stop" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white rounded py-2 font-semibold">Stop</button>
    </div>

    <div class="flex gap-2">
      <button id="btn-export" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white rounded py-1 text-sm">Export CSV</button>
      <button id="btn-clear" class="flex-1 bg-slate-400 hover:bg-slate-500 text-white rounded py-1 text-sm">Clear All</button>
    </div>
  </section>

  <!-- MIDDLE: METRICS + RESULTS -->
  <section class="col col-span-6 bg-white rounded shadow p-3 space-y-3">
    <h2 class="font-semibold text-slate-700">Results</h2>
    <div class="grid grid-cols-3 gap-2 text-sm">
      <div class="bg-slate-100 p-2 rounded">Time: <span id="m-time" class="font-mono">00:00</span></div>
      <div class="bg-slate-100 p-2 rounded">Pages: <span id="m-pages">0</span></div>
      <div class="bg-slate-100 p-2 rounded">URLs: <span id="m-urls-done">0/0</span></div>
      <div class="bg-emerald-50 p-2 rounded text-emerald-800 font-semibold">New: <span id="m-new">0</span></div>
      <div class="bg-slate-100 p-2 rounded">Dupes: <span id="m-dupes">0</span></div>
      <div class="bg-rose-50 p-2 rounded text-rose-700">Errors: <span id="m-errors">0</span></div>
    </div>

    <div class="overflow-auto" style="max-height: calc(100vh - 280px);">
      <table class="w-full text-left text-sm">
        <thead class="bg-slate-100 sticky top-0">
          <tr>
            <th class="p-1">ID</th>
            <th class="p-1">Price</th>
            <th class="p-1">Address</th>
            <th class="p-1 text-center">Beds</th>
            <th class="p-1">Type</th>
            <th class="p-1">Agent</th>
            <th class="p-1">Tags</th>
          </tr>
        </thead>
        <tbody id="leads-body"></tbody>
      </table>
    </div>
  </section>

  <!-- RIGHT: LOG -->
  <section class="col col-span-3 bg-white rounded shadow p-3">
    <h2 class="font-semibold text-slate-700 mb-2">Log</h2>
    <div id="log" class="overflow-y-auto bg-slate-50 rounded p-2 text-xs" style="height: calc(100vh - 120px);"></div>
  </section>
</div>

<script src="/static/rightmove_app.js"></script>
</body>
</html>
